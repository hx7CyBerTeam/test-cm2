workflows:
  ios-unsigned-test:
    name: iOS unsigned test build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install

      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --clean

      - name: Point Xcode at the correct Node binary
        script: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build unsigned
        script: |
          xcode-project build-ipa \
            --workspace "ios/cmtest2.xcworkspace" \
            --scheme "cmtest2" \
            -- CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/ipa/*.ipa

  ios-release:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Raze Apple
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install

      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --clean

      - name: Point Xcode at the correct Node binary
        script: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up signing
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "ink.raze.app" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "ios/cmtest2.xcodeproj"

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/cmtest2.xcworkspace" \
            --scheme "cmtest2"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
